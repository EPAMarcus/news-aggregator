name: Claude Code Review

# Manual only: run it from the Actions tab (or `gh workflow run`) once a PR is ready for review.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      effort:
        description: Review effort level
        required: true
        type: choice
        default: high
        options: [low, medium, high, xhigh, max]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # Full history of the PR head so the review can diff against the base branch
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Log the full session so a silent run (no comments) can be diagnosed
          show_full_output: true
          # Nothing but the slash command: any further prompt text is passed to the skill as part
          # of its review target
          prompt: "/code-review ${{ inputs.effort }} --comment ${{ inputs.pr_number }}"
          # A workflow_dispatch run has no PR context, so the action does not start the
          # inline-comment MCP server. The skill's documented fallback is `gh api`, which posts one
          # review comment per finding, attached to the line of code. Read access lets the review
          # inspect the code and the diff. `gh pr comment` is deliberately not allowed, so findings
          # cannot end up in one summary comment.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
            --append-system-prompt "Repository: ${{ github.repository }}. Pull request: ${{ inputs.pr_number }}, already checked out, so git rev-parse HEAD is its head commit. Post every finding as its own inline review comment on the exact line of code it concerns, by running: gh api --method POST repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments -f body=TEXT -f commit_id=HEAD_SHA -f path=FILE -F line=LINE -f side=RIGHT. Start each body with the finding summary, then the failure scenario. If a comment is rejected because the line is not part of the diff, retry once on the nearest changed line of the same file, otherwise skip it and list it in your final message. Never put findings into a single summary comment."
