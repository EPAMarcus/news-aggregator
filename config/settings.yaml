# Global settings. See docs/SPEC.md sections 4 to 6.

# The recipient of every digest and alert email is not configured here. It is read from the
# RECIPIENT_EMAIL environment variable (a GitHub Actions secret), e.g. RECIPIENT_EMAIL=you@example.com

# Top-level categories, one word each. A source `topic` must start with one of these
# ("Tech" or "Tech/AI"); the part after the first "/" is free-form.
categories:
  - Tech
  - SAP
  - Business
  - Science
  - Politics
  - Philosophy
  - Health
  - Other

# Claude model per digest level. claude-sonnet-5-5 verified as a current Claude API model ID on
# 2026-10-19 (https://platform.claude.com/docs/en/models/overview; retirement not before
# 2027-09-28). Re-check this page before changing a model.
models:
  daily: claude-sonnet-5-5
  weekly: claude-sonnet-5-5
  monthly: claude-sonnet-5-5
  yearly: claude-sonnet-5-5

# Length limits: bullets for the daily digest, words for the others.
limits:
  daily_bullets: 10
  weekly_words: 300
  monthly_words: 500
  yearly_words: 2500

# A source that produced no items for this many days is flagged as stale.
stale_after_days: 30
