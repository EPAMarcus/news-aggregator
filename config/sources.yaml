# Source list. See docs/SPEC.md section 3.
#
# Common fields:
#   id       unique, lowercase letters, digits, "-" and "_"
#   name     shown in the digest's Sources section
#   type     rss | web | newsletter
#   topic    optional clustering hint: a category from settings.yaml ("Tech"),
#            optionally with a free-form sub-category ("Tech/AI")
#   enabled  optional, default true
#
# Type-specific fields:
#   rss         url
#   web         url, optional selector (CSS selector for article links)
#   newsletter  from (sender address in the aggregator inbox)

sources:
  # --- SAP ---
  - id: sap-news
    name: SAP News Center
    type: rss
    url: https://news.sap.com/feed/
    topic: SAP

  - id: sap-community-sap-blogs
    name: SAP Community – Technology Blogs by SAP
    type: rss
    url: https://community.sap.com/khhcw49343/rss/board?board.id=technology-blog-sap
