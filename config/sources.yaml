# Source list. See docs/SPEC.md section 3.
#
# Common fields:
#   id       unique, lowercase letters, digits, "-" and "_"
#   name     shown in the digest's Sources section
#   type     rss | web | newsletter
#   topic    optional clustering hint: a category from settings.yaml ("Tech"),
#            optionally with a free-form sub-category ("Tech/AI")
#   enabled  optional, default true
#
# Type-specific fields:
#   rss         url
#   web         url, optional selector (CSS selector for article links)
#   newsletter  from (sender address in the aggregator inbox)

sources:
  - id: sap-news
    name: SAP News Center
    type: rss
    url: https://news.sap.com/feed/
    topic: SAP

  - id: martin-fowler
    name: Martin Fowlers Blog
    type: rss
    url: https://martinfowler.com/feed.atom
    topic: Tech

  - id: hacker-news
    name: Hacker News RSS
    type: rss
    url: https://news.ycombinator.com/rss
    topic: Tech

  - id: new-stack
    name: News Stack RSS
    type: rss
    url:  https://thenewstack.io/feed/
    topic: Tech

  - id: the-verge
    name: The Verge RSS
    type: rss
    url:  https://www.theverge.com/rss/index.xml
    topic: Tech

  - id: iai
    name: Institute of Art and Ideas RSS
    type: rss
    url: https://iai.tv/articles-proxy/rss
    topic: Philosophy

