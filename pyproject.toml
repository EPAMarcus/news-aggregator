[project]
name = "news-aggregator"
version = "0.1.0"
description = "Personal news aggregator that produces daily, weekly, monthly and yearly digests."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
aggregator = "aggregator.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.build-backend]
module-name = "aggregator"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
